</header>

<!-- Navbar -->

<!-- Main Content -->
<main class="person-detail">
    <div class="person-hero">
        <div class="person-image">
            <img src="" alt="Person Image" id="personImage">
        </div>
        <div class="person-info">
            <h1 id="personName">Name</h1>
            <h3 id="personRole">Role</h3>
            <p id="personBio">Bio goes here...</p>
        </div>
    </div>

    <!-- Tabs -->
    <div class="tabs">
        <button class="tab-btn active" data-tab="worksTab">Top Works</button>
        <button class="tab-btn" data-tab="Discussions" id="discussionId">Discussions</button>
    </div>

    <!-- Works Tab -->
    <div class="tab-content" id="worksTab">
        <ul id="worksList"></ul>
    </div>

    <!-- Discussions Tab -->
    <div class="tab-content hidden" id="discussionsTab">
        <div id="discussionsList"></div>
    </div>
</main>
